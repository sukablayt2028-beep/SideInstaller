name: Build and upload iOS app

on:
  push:
    branches: [ main, "resign-install-feature" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install Homebrew packages (xcodegen, xcpretty)
      run: |
        set -e
        echo "Installing XcodeGen and xcpretty..."
        brew update
        brew install xcodegen || true
        gem install xcpretty --no-document || true

    - name: Generate Xcode project
      run: |
        set -e
        xcodegen generate --spec project.yml

    - name: Show available simulator destinations (diagnostic)
      run: |
        set -e
        echo "Available destinations for the SideInstaller scheme:"
        xcodebuild -project SideInstaller.xcodeproj -scheme SideInstaller -sdk iphonesimulator -showdestinations || true

    - name: Build (iOS Simulator, Release) — generic simulator
      run: |
        set -e
        echo "Building SideInstaller for iOS Simulator (Release) using generic platform..."
        xcodebuild -project SideInstaller.xcodeproj \
          -scheme SideInstaller \
          -configuration Release \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          clean build CODE_SIGNING_ALLOWED=NO | xcpretty

    - name: Collect built app
      run: |
        set -e
        mkdir -p output
        # xcodebuild writes build products into ./build/ for generated projects by default,
        # but DerivedData can be used in other setups. Try both common locations.
        APP_PATHS=(
          "build/Release-iphonesimulator/SideInstaller.app"
          "build/Release/SideInstaller.app"
          "$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 3 -type d -name 'Build' -prune -exec find {} -type d -path '*/Products/Release-iphonesimulator/SideInstaller.app' -print \; )"
        )
        FOUND=""
        for p in "${APP_PATHS[@]}"; do
          if [ -d "$p" ]; then
            FOUND="$p"
            break
          fi
        done
        if [ -z "$FOUND" ]; then
          echo "Expected app not found in common build locations. Listing build/ and DerivedData:"
          ls -la build || true
          ls -la ~/Library/Developer/Xcode/DerivedData || true
          exit 1
        fi
        cp -R "$FOUND" output/
        ls -la output

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SideInstaller-simulator-app
        path: output/SideInstaller.app
